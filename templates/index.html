<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MailPilot AI</title>

    <link rel="stylesheet" href="/static/style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

</head>

<body>

<div class="bg-gradient"></div>

<!-- Draft Modal -->

<div id="draftModal" class="modal">

    <div class="modal-content">

        <span class="close" onclick="closeDraft()">&times;</span>

        <div id="draftContent"></div>

    </div>

</div>

<div class="wrapper">

    <!-- Header -->

    <header class="header">

        <div class="logo">

            <div class="logo-icon">✦</div>

            <div>

                <h2>MailPilot AI</h2>

                <small>AI Email Assistant</small>

            </div>

        </div>

        <div class="header-actions">

            <div class="automation-card">

                <span>Automation</span>

                <label class="switch">

                    <input
                        type="checkbox"
                        id="autoToggle"
                        {% if auto_send %}checked{% endif %}
                    >

                    <span class="slider"></span>

                </label>

            </div>

            <button
                class="refresh-btn"
                onclick="loadEmails(currentStatus)">

                Refresh

            </button>

        </div>

    </header>
